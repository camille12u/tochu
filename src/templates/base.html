<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOCHU {% block title %}{% endblock title %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/modern-normalize-3.0.1.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>

<body>
    <header>
        <nav>
            <a href="{% url 'top' %}">TOCHU</a>
            <ul>
                {% if user.is_authenticated %}
                <li><a href="{% url 'log_list' %}">学習記録</a></li>
                <li><a href="{% url 'account_logout' %}">ログアウト</a></li>
                {% else %}
                <li><a href="{% url 'account_login' %}">ログイン</a></li>
                <li><a href="{% url 'account_signup' %}">ユーザー登録</a></li>
                {% endif %}
            </ul>
        </nav>
        {% if messages %}
            <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
            </ul>
        {% endif %}    
    </header>

    <main>
        {% block content %}
        {% endblock content %}
    </main>

    <footer></footer>
</body>

</html>
